name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Install project and development dependencies
        run: uv sync --locked --all-extras

      - name: Check public tree
        run: .venv/bin/python scripts/check_public_tree.py

      - name: Lint
        run: .venv/bin/ruff check src tests scripts

      - name: Check formatting
        run: .venv/bin/ruff format --check src tests scripts

      - name: Type check
        run: .venv/bin/mypy src

      - name: Test
        run: .venv/bin/python -m pytest

      - name: Build distribution
        run: .venv/bin/python -m build

      - name: Check distribution metadata
        run: .venv/bin/twine check dist/*

      - name: Audit installed dependencies
        run: .venv/bin/pip-audit --skip-editable
